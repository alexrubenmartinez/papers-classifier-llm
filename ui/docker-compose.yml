# examen-ui — SPA Angular sirviendo el dashboard del examen-api.
# Deploy:
#   scp -r examen/ui/ root@VPS:/root/proyecto_papers/examen-ui/
#   ssh root@VPS "cd /root/proyecto_papers/examen-ui && docker compose up -d --build"
#
# El container vive en stack_web y se accede SOLO via el nginx central del stack
# (vhost examen-ui.your-vps.example.com). No publica puerto al host.

services:
  examen-ui:
    build: .
    image: examen-ui:latest
    container_name: examen-ui
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
    name: stack_web
